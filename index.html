<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dunia Haiwan — Prasekolah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --dakwat:#2F2A62;
  --kuning:#FFC63C;
  --biru:#3FA9F5;
  --hijau:#63C842;
  --merah:#FF6F61;
  --ungu:#A970E8;
  --putih:#FFFFFF;
  --lembut:rgba(47,42,98,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:linear-gradient(180deg,#C2ECFF 0%,#DFF6E4 55%,#FFF3CE 100%);
  background-attachment:fixed;
  color:var(--dakwat);
  font-family:'Fredoka',system-ui,sans-serif;
  font-size:20px;line-height:1.5;
}
button{font-family:'Fredoka',sans-serif;border:0;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--ungu);outline-offset:3px;border-radius:14px}
h1,h2{margin:0;font-weight:600;line-height:1.15}
.em{
  display:block;line-height:1;margin:0 auto;
  font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;
  font-weight:400;
}

header{padding:.9rem 1rem .2rem;text-align:center}
header h1{font-size:1.9rem;color:#1F6FA8;letter-spacing:.5px}
header .kecil{font-size:.95rem;color:#4A6B7C}
.bunyi-togol{font-family:'Noto Color Emoji',sans-serif;
  position:absolute;top:.9rem;right:.9rem;
  width:52px;height:52px;border-radius:50%;
  background:var(--putih);box-shadow:0 4px 0 var(--lembut);
  font-size:1.6rem;line-height:1;
}

nav{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;padding:.8rem 1rem 0}
nav button{
  min-width:96px;padding:.6rem .5rem .5rem;border-radius:20px;
  background:var(--putih);box-shadow:0 5px 0 var(--lembut);
  font-size:.95rem;font-weight:500;
}
nav button .em{margin:0 auto .1rem}
nav button[aria-current="true"]{background:var(--kuning);box-shadow:0 5px 0 #D79E12}
nav button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lembut)}

main{max-width:860px;margin:0 auto;padding:1rem 1rem 3rem}
section[hidden]{display:none}
.arah{text-align:center;font-size:1.15rem;margin:.2rem 0 1rem;color:#3D5A6C}

.kumpulan{background:var(--putih);border-radius:28px;padding:.9rem;margin-bottom:1rem;box-shadow:0 6px 0 var(--lembut)}
.kepala{
  display:flex;align-items:center;gap:.45rem;justify-content:center;
  font-size:1.25rem;font-weight:600;color:#fff;
  padding:.4rem 1.1rem;border-radius:999px;margin:0 auto .8rem;width:fit-content;
}
.rak{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem}
.kad{background:#F6FAFF;border-radius:22px;padding:.7rem .4rem .6rem;text-align:center;box-shadow:0 4px 0 var(--lembut)}
.kad .nama{font-size:1.05rem;font-weight:500;margin-top:.25rem;display:block}
.kad:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lembut)}

.bunyi-rak{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.9rem}
.bkad{background:var(--putih);border-radius:28px;padding:1rem .6rem;text-align:center;box-shadow:0 6px 0 var(--lembut)}
.bkad .kata{display:inline-block;margin-top:.4rem;padding:.25rem 1rem;border-radius:999px;background:var(--kuning);font-size:1.3rem;font-weight:600}
.bkad:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lembut)}

.papan{background:var(--putih);border-radius:32px;padding:1.1rem 1rem 1.3rem;box-shadow:0 7px 0 var(--lembut);position:relative;overflow:hidden}
.baris-bintang{display:flex;justify-content:center;flex-wrap:wrap;gap:.2rem;font-size:1.7rem;min-height:2.1rem;margin-bottom:.3rem}
.bintang-slot{color:#DDE3EC;transition:color .15s}
.bintang-slot.kena{color:var(--kuning);animation:kelip .4s}
.bintang-slot.tersasar{color:var(--merah)}
@keyframes kelip{0%{transform:scale(.5) rotate(-15deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.rel{height:14px;background:#EDF1F7;border-radius:99px;overflow:hidden;margin-bottom:1rem}
.rel>div{height:100%;width:0;background:var(--hijau);border-radius:99px;transition:width .3s}
.tanya{text-align:center;font-size:1.5rem;font-weight:600;margin-bottom:.9rem}
.jumbo{display:flex;justify-content:center;margin:.2rem 0 .5rem}
.jumbo.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pilih{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:.7rem}
.opsi{
  background:#F6FAFF;border-radius:24px;padding:.8rem .4rem .7rem;
  box-shadow:0 5px 0 var(--lembut);text-align:center;font-size:1.05rem;font-weight:500;
  border:4px solid transparent;
}
.opsi .em{margin:0 auto .15rem}
.opsi:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lembut)}
.opsi.betul{background:#E4FBD6;border-color:var(--hijau)}
.opsi.salah{background:#FFE6E2;border-color:var(--merah)}
.opsi[disabled]{cursor:default}
.kata-balas{text-align:center;min-height:2.2rem;margin-top:.9rem;font-size:1.2rem;font-weight:500}
.kata-balas.ok{color:#3F8F1E}
.kata-balas.no{color:#C9432F}
.baris{display:flex;gap:.7rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.besar{padding:.8rem 1.6rem;border-radius:999px;font-size:1.15rem;font-weight:600;background:var(--biru);color:#fff;box-shadow:0 5px 0 #1E7CBE}
.besar.dua{background:var(--putih);color:var(--biru);box-shadow:0 5px 0 var(--lembut)}
.besar:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}

.konf{position:absolute;width:12px;height:12px;border-radius:3px;pointer-events:none;animation:jatuh 1.1s ease-in forwards}
@keyframes jatuh{to{transform:translateY(320px) rotate(540deg);opacity:0}}


@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{nav,.bunyi-togol,.baris{display:none!important}body{background:#fff}section[hidden]{display:block!important}}
</style>
</head>
<body>

<button class="bunyi-togol" id="togol" aria-label="Buka atau tutup suara">&#128266;</button>

<header>
  <h1>Dunia Haiwan</h1>
  <div class="kecil">Prasekolah &middot; 4&ndash;6 tahun</div>
</header>

<nav id="nav" aria-label="Menu"></nav>

<main>

<section id="kenali">
  <p class="arah">Tekan haiwan untuk melihatnya</p>
  <div id="rak-kumpulan"></div>
</section>

<section id="bunyi" hidden>
  <p class="arah">Tekan kad untuk dengar bunyi</p>
  <div class="bunyi-rak" id="rak-bunyi"></div>
</section>

<section id="rumah" hidden>
  <div class="papan">
    <div class="baris-bintang" id="r-bintang"></div>
    <div class="rel"><div id="r-rel"></div></div>
    <div class="jumbo" id="r-em" aria-hidden="true"></div>
    <div class="tanya" id="r-tanya"></div>
    <div class="pilih" id="r-pilih"></div>
    <p class="kata-balas" id="r-balas" role="status"></p>
    <div class="baris">
      <button class="besar" id="r-next">Seterusnya</button>
      <button class="besar dua" id="r-ulang">Main lagi</button>
    </div>
  </div>
</section>

<section id="kuiz" hidden>
  <div class="papan">
    <div class="baris-bintang" id="k-bintang"></div>
    <div class="rel"><div id="k-rel"></div></div>
    <div class="tanya" id="k-tanya"></div>
    <div class="pilih" id="k-pilih"></div>
    <p class="kata-balas" id="k-balas" role="status"></p>
    <div class="baris">
      <button class="besar" id="k-next">Seterusnya</button>
      <button class="besar dua" id="k-ulang">Main lagi</button>
    </div>
  </div>
</section>

</main>

<script>
(function(){
"use strict";

/* ============ EMOJI ============ */
var E = {
  "Kucing":"\uD83D\uDC31","Anjing":"\uD83D\uDC36","Arnab":"\uD83D\uDC30","Ikan emas":"\uD83D\uDC20",
  "Ayam":"\uD83D\uDC13","Lembu":"\uD83D\uDC04","Kambing":"\uD83D\uDC10","Itik":"\uD83E\uDD86",
  "Singa":"\uD83E\uDD81","Harimau":"\uD83D\uDC05","Gajah":"\uD83D\uDC18","Zirafah":"\uD83E\uDD92",
  "Ikan":"\uD83D\uDC1F","Ikan paus":"\uD83D\uDC0B","Burung":"\uD83D\uDC26","Rama-rama":"\uD83E\uDD8B",
  "Rumah":"\uD83C\uDFE0","Ladang":"\uD83D\uDE9C","Hutan":"\uD83C\uDF32","Air":"\uD83C\uDF0A","Udara":"\u2601\uFE0F",
  "_kenali":"\uD83D\uDC3E","_bunyi":"\uD83D\uDD14","_kuiz":"\u2B50","_piala":"\uD83C\uDFC6"
};

function gambar(nama, saiz){
  var e = E[nama] || E["_kenali"];
  return '<span class="em" style="font-size:'+Math.round(saiz*0.82)+'px" aria-hidden="true">'+e+'</span>';
}

/* ============ SUARA (bunyi haiwan sahaja) ============ */
var suaraHidup = true;
var togol = document.getElementById("togol");
togol.onclick = function(){
  suaraHidup = !suaraHidup;
  togol.innerHTML = suaraHidup ? "&#128266;" : "&#128263;";
  if(!suaraHidup && "speechSynthesis" in window) window.speechSynthesis.cancel();
};
function cakap(teks){
  if(!suaraHidup) return;
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(teks);
    u.lang = "ms-MY"; u.rate = 0.8; u.pitch = 1.15;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ DATA ============ */
var KUMPULAN = [
  {nama:"Di rumah kita", warna:"var(--kuning)", tempat:"Rumah",
   ahli:["Kucing","Anjing","Arnab","Ikan emas"]},
  {nama:"Di ladang", warna:"var(--hijau)", tempat:"Ladang",
   ahli:["Ayam","Lembu","Kambing","Itik"]},
  {nama:"Di hutan", warna:"var(--merah)", tempat:"Hutan",
   ahli:["Singa","Harimau","Gajah","Zirafah"]},
  {nama:"Di dalam air", warna:"var(--biru)", tempat:"Air",
   ahli:["Ikan","Ikan paus"]},
  {nama:"Di udara", warna:"var(--ungu)", tempat:"Udara",
   ahli:["Burung","Rama-rama"]}
];

var BUNYI = [
  {nama:"Kucing", kata:"meow"},
  {nama:"Ayam",   kata:"kokok"},
  {nama:"Lembu",  kata:"moo"},
  {nama:"Itik",   kata:"kwek-kwek"}
];

var SOALAN = [
  ["Siapa berbunyi meow?",        ["Kucing","Itik","Lembu"], "Kucing"],
  ["Siapa berbunyi kokok?",       ["Ayam","Ikan emas","Arnab"], "Ayam"],
  ["Siapa berbunyi moo?",         ["Lembu","Burung","Singa"], "Lembu"],
  ["Siapa berbunyi kwek-kwek?",   ["Itik","Kambing","Gajah"], "Itik"],
  ["Siapa ada belalai panjang?",  ["Gajah","Kucing","Ayam"], "Gajah"],
  ["Siapa ada leher panjang?",    ["Zirafah","Anjing","Itik"], "Zirafah"],
  ["Siapa hidup dalam air?",      ["Ikan","Singa","Rama-rama"], "Ikan"],
  ["Siapa terbang di udara?",     ["Rama-rama","Lembu","Ikan paus"], "Rama-rama"],
  ["Siapa paling besar di laut?", ["Ikan paus","Arnab","Ayam"], "Ikan paus"],
  ["Siapa ada tanduk di ladang?", ["Kambing","Ikan emas","Burung"], "Kambing"],
  ["Siapa raja hutan?",           ["Singa","Itik","Kucing"], "Singa"],
  ["Siapa menjaga rumah kita?",   ["Anjing","Gajah","Ikan"], "Anjing"]
];

var TEMPAT = ["Rumah","Ladang","Hutan","Air","Udara"];

/* ============ ALAT ============ */
function kocok(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}return b;}

function soalanTempat(tempat, nama){
  if(tempat==="Udara") return nama+" bergerak di mana?";
  if(tempat==="Air") return nama+" berenang di mana?";
  if(tempat==="Hutan") return nama+" tinggal di mana?";
  return "Rumah "+nama.toLowerCase()+" di mana?";
}

function renderBintang(kontena, hasil){
  kontena.innerHTML="";
  hasil.forEach(function(h){
    var s=document.createElement("span");
    s.className="bintang-slot"+(h===1?" kena":h===-1?" tersasar":"");
    s.textContent="\u2605";
    kontena.appendChild(s);
  });
}

function raikan(papan){
  var warna=["#FFC63C","#FF6F61","#63C842","#3FA9F5","#A970E8","#FF8FC4"], i;
  for(i=0;i<18;i++){
    var d=document.createElement("div");
    d.className="konf";
    d.style.background=warna[i%warna.length];
    d.style.left=(8+Math.random()*84)+"%";
    d.style.top="-14px";
    d.style.animationDelay=(Math.random()*.25)+"s";
    papan.appendChild(d);
    (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1500); })(d);
  }
}

/* ============ MENU ============ */
var MENU=[["kenali","Kenali","_kenali"],["bunyi","Bunyi","_bunyi"],["rumah","Rumah siapa","Rumah"],["kuiz","Main kuiz","_kuiz"]];
var nav=document.getElementById("nav");
MENU.forEach(function(m,n){
  var b=document.createElement("button");
  b.dataset.go=m[0];
  b.setAttribute("aria-current", n===0?"true":"false");
  b.innerHTML=gambar(m[2],34)+m[1];
  nav.appendChild(b);
});
nav.addEventListener("click",function(e){
  var b=e.target.closest("button[data-go]"); if(!b) return;
  Array.prototype.forEach.call(nav.querySelectorAll("button"),function(x){x.setAttribute("aria-current", x===b?"true":"false");});
  MENU.forEach(function(m){ document.getElementById(m[0]).hidden = (m[0]!==b.dataset.go); });
  window.scrollTo(0,0);
});

/* ============ KENALI ============ */
var rk=document.getElementById("rak-kumpulan");
KUMPULAN.forEach(function(g){
  var d=document.createElement("div"); d.className="kumpulan";
  var kad=g.ahli.map(function(a){
    return '<button class="kad" data-nama="'+a+'">'+gambar(a,68)+'<span class="nama">'+a+'</span></button>';
  }).join("");
  d.innerHTML='<div class="kepala" style="background:'+g.warna+'">'+gambar(g.tempat,26)+g.nama+'</div><div class="rak">'+kad+'</div>';
  rk.appendChild(d);
});
rk.addEventListener("click",function(e){
  var c=e.target.closest("[data-nama]");
  if(c && c.animate) c.animate([{transform:"scale(1)"},{transform:"scale(.93)"},{transform:"scale(1)"}],{duration:200});
});

/* ============ BUNYI ============ */
var rb=document.getElementById("rak-bunyi");
BUNYI.forEach(function(b){
  var el=document.createElement("button"); el.className="bkad";
  el.innerHTML=gambar(b.nama,88)+'<span class="kata">'+b.kata+'</span>';
  el.onclick=function(){ cakap(b.kata); };
  rb.appendChild(el);
});

/* ============ RUMAH SIAPA ============ */
var kolam=[];
KUMPULAN.forEach(function(g){ g.ahli.forEach(function(a){ kolam.push({nama:a, jwp:g.tempat}); }); });
var rSet=[],ri=0,rSkor=0,rDone=false,rHasil=[];
var rEm=document.getElementById("r-em"),rTanya=document.getElementById("r-tanya"),
    rPil=document.getElementById("r-pilih"),rBalas=document.getElementById("r-balas"),
    rBin=document.getElementById("r-bintang"),rRel=document.getElementById("r-rel"),
    rPapan=rPil.closest(".papan");

function rPapar(){
  rDone=false; rBalas.textContent=""; rBalas.className="kata-balas";
  var s=rSet[ri];
  rEm.innerHTML=gambar(s.nama,120);
  rEm.classList.remove("pop"); void rEm.offsetWidth; rEm.classList.add("pop");
  rTanya.textContent=soalanTempat(s.jwp, s.nama);
  renderBintang(rBin, rHasil);
  rRel.style.width=Math.round(((ri+1)/rSet.length)*100)+"%";
  rPil.innerHTML="";
  TEMPAT.forEach(function(t){
    var b=document.createElement("button"); b.className="opsi";
    b.innerHTML=gambar(t,56)+t;
    b.onclick=function(){ rTekan(t,b,s); };
    rPil.appendChild(b);
  });
}
function rTekan(pilih,btn,s){
  if(rDone) return; rDone=true;
  Array.prototype.forEach.call(rPil.children,function(b){b.disabled=true;});
  if(pilih===s.jwp){
    rSkor++; rHasil[ri]=1; btn.classList.add("betul"); raikan(rPapan);
    renderBintang(rBin, rHasil);
    rBalas.className="kata-balas ok"; rBalas.textContent="Betul! Hebat";
  }else{
    rHasil[ri]=-1; btn.classList.add("salah");
    renderBintang(rBin, rHasil);
    Array.prototype.forEach.call(rPil.children,function(b){ if(b.textContent===s.jwp) b.classList.add("betul"); });
    rBalas.className="kata-balas no"; rBalas.textContent="Cuba lagi ya. Jawapannya "+s.jwp+".";
  }
}
document.getElementById("r-next").onclick=function(){
  if(!rDone){ rBalas.className="kata-balas no"; rBalas.textContent="Pilih satu tempat dulu"; return; }
  if(ri<rSet.length-1){ ri++; rPapar(); }
  else{
    rEm.innerHTML=gambar("_piala",120);
    rTanya.textContent="Kamu dapat "+rSkor+" bintang!";
    rPil.innerHTML=""; rBalas.className="kata-balas ok"; rBalas.textContent="Syabas!";
    raikan(rPapan);
  }
};
function rMula(){ rSet=kocok(kolam); ri=0; rSkor=0; rHasil=new Array(rSet.length).fill(0); rPapar(); }
document.getElementById("r-ulang").onclick=rMula;
rMula();

/* ============ KUIZ ============ */
var kSet=[],ki=0,kSkor=0,kDone=false,kHasil=[];
var kTanya=document.getElementById("k-tanya"),kPil=document.getElementById("k-pilih"),
    kBalas=document.getElementById("k-balas"),kBin=document.getElementById("k-bintang"),
    kRel=document.getElementById("k-rel"),kPapan=kPil.closest(".papan");

function kPapar(){
  kDone=false; kBalas.textContent=""; kBalas.className="kata-balas";
  var q=kSet[ki];
  kTanya.textContent=q[0];
  renderBintang(kBin, kHasil);
  kRel.style.width=Math.round(((ki+1)/kSet.length)*100)+"%";
  kPil.innerHTML="";
  kocok(q[1]).forEach(function(p){
    var b=document.createElement("button"); b.className="opsi";
    b.innerHTML=gambar(p,72)+p;
    b.onclick=function(){ kTekan(p,b,q); };
    kPil.appendChild(b);
  });
}
function kTekan(pilih,btn,q){
  if(kDone) return; kDone=true;
  Array.prototype.forEach.call(kPil.children,function(b){b.disabled=true;});
  if(pilih===q[2]){
    kSkor++; kHasil[ki]=1; btn.classList.add("betul"); raikan(kPapan);
    renderBintang(kBin, kHasil);
    kBalas.className="kata-balas ok"; kBalas.textContent="Betul!";
  }else{
    kHasil[ki]=-1; btn.classList.add("salah");
    renderBintang(kBin, kHasil);
    Array.prototype.forEach.call(kPil.children,function(b){ if(b.textContent===q[2]) b.classList.add("betul"); });
    kBalas.className="kata-balas no"; kBalas.textContent="Jawapannya "+q[2]+".";
  }
}
document.getElementById("k-next").onclick=function(){
  if(!kDone){ kBalas.className="kata-balas no"; kBalas.textContent="Pilih satu gambar dulu"; return; }
  if(ki<kSet.length-1){ ki++; kPapar(); }
  else{
    kTanya.textContent="Kamu dapat "+kSkor+" bintang!";
    kPil.innerHTML=gambar("_piala",110);
    kPil.style.display="flex"; kPil.style.justifyContent="center";
    kBalas.className="kata-balas ok"; kBalas.textContent="Syabas, jom main lagi!";
    raikan(kPapan);
  }
};
function kMula(){
  kSet=kocok(SOALAN); ki=0; kSkor=0; kHasil=new Array(kSet.length).fill(0);
  kPil.style.display=""; kPil.style.justifyContent="";
  kPapar();
}
document.getElementById("k-ulang").onclick=kMula;
kMula();

})();
</script>
</body>
</html>
